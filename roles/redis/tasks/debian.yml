---
- name: Install python3-debian (required by deb822_repository)
  apt:
    name: python3-debian
    state: present
  tags:
    - sw
    - apt

- name: Remove legacy Redis apt source (pre-deb822)
  file:
    path: /etc/apt/sources.list.d/packages_redis_io_deb.list
    state: absent
  tags:
    - sw
    - apt

- name: Install Redis APT Repository
  deb822_repository:
    name: redis
    types: deb
    uris: https://packages.redis.io/deb
    suites: "{{ ubuntu_version | default(ansible_distribution_release) }}"
    components: main
    signed_by: https://packages.redis.io/gpg
    state: "{{ redis_state }}"
  tags:
    - sw
    - apt

- name: Install Redis packages
  apt:
    name: "{{ packages }}"
    update_cache: yes
    state: "{{ redis_state }}"
  vars:
    packages: "{{ redis_packages }}"
