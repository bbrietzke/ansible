---
- name: Install required Docker packages
  apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages: "{{ add_packages }}"

- name: Remove conflicting packages
  apt:
    name: "{{ packages }}"
    state: absent
  vars:
    packages: "{{ remove_packages }}"
  notify:
    - restart_machine

- name: Install python3-debian (required by deb822_repository)
  apt:
    name: python3-debian
    state: present

- name: Remove legacy Docker apt source (pre-deb822)
  file:
    path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    state: absent

- name: Install Docker APT Repository
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ubuntu_version }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: "{{ docker_state }}"
  tags:
    - sw
    - apt

- name: Install Docker specific packages
  apt:
    name: "{{ packages }}"
    state: "{{ docker_state }}"
    update_cache: yes
  vars:
    packages: "{{ docker_packages }}"

- name: Add {{ ansible_user }} to docker group
  user:
    name: '{{ ansible_user }}'
    groups: docker
    append: yes