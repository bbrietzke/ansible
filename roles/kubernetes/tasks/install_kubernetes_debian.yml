---
- name: Install required Kubernetes packages
  apt:
    name: "{{ packages }}"
    state: "{{ kubernetes_state }}"
  vars:
    packages: "{{ add_packages }}"
  tags:
    - sw
    - apt

- name: Install python3-debian (required by deb822_repository)
  apt:
    name: python3-debian
    state: present
  tags:
    - sw
    - apt

- name: Find legacy Kubernetes apt sources (pre-deb822)
  find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "pkgs_k8s_io_*.list"
      - "apt_kubernetes_io*.list"
      - "kubernetes.list"
  register: legacy_k8s_sources
  tags:
    - sw
    - apt

- name: Remove legacy Kubernetes apt sources
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ legacy_k8s_sources.files }}"
  tags:
    - sw
    - apt

- name: Install Kubernetes APT Repository
  deb822_repository:
    name: kubernetes
    types: deb
    uris: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/
    suites: "/"
    signed_by: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/Release.key
    state: "{{ kubernetes_state }}"
  tags:
    - sw
    - apt

- name: Install Kubernetes specific packages
  apt:
    name: "{{ packages }}"
    update_cache: yes
    state: "{{ kubernetes_state }}"
  vars:
    packages: "{{ kubernetes_packages }}"
  tags:
    - sw
    - apt
