---

- name: Install python3-debian (required by deb822_repository)
  apt:
    name: python3-debian
    state: present

- name: Remove legacy HashiCorp apt source (pre-deb822)
  file:
    path: /etc/apt/sources.list.d/apt_releases_hashicorp_com.list
    state: absent

- name: Install HashiCorp APT Repository
  deb822_repository:
    name: hashicorp
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ubuntu_version }}"
    components: main
    signed_by: https://apt.releases.hashicorp.com/gpg
    state: "{{ consul_state }}"

- name: Install Consul packages
  apt:
    name: "{{ packages }}"
    update_cache: yes
    state: "{{ consul_state }}"
  vars:
    packages: "{{ consul_packages }}"

- name: Enable Consul
  service:
    name: consul
    enabled: yes
