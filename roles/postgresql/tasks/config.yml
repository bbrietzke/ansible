---
- name: Find installed PostgreSQL clusters
  find:
    paths: /etc/postgresql
    file_type: directory
    recurse: no
  register: postgres_installed_versions
  when: postgres_version is not defined

- name: Use the newest installed PostgreSQL major version
  set_fact:
    postgres_version: "{{ postgres_installed_versions.files | map(attribute='path') | map('basename') | map('int') | max }}"
  when:
    - postgres_version is not defined
    - postgres_installed_versions.matched | default(0) > 0

- name: Configure PostgreSQL {{ postgres_version | default('') }}
  when: postgres_version is defined
  block:
    - name: Write Ansible-managed postgresql.conf overrides
      notify: restart_postgres
      template:
        src: postgresql.conf.j2
        dest: "/etc/postgresql/{{ postgres_version }}/main/conf.d/ansible.conf"
        owner: postgres
        group: postgres
        mode: 0644
      when: postgres_state == "present"

    - name: Allow remote logins in pg_hba.conf
      notify: restart_postgres
      lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
        regexp: "^host\\s+all\\s+all\\s+{{ item | regex_escape }}\\s"
        line: "host all all {{ item }} {{ postgres_auth_method }}"
        state: "{{ postgres_state }}"
      loop: "{{ postgres_remote_networks }}"
