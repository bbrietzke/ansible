---
- name: Install python3-debian (required by deb822_repository)
  apt:
    name: python3-debian
    state: present
  tags:
    - sw
    - apt

- name: Install ElasticSearch APT Repository
  deb822_repository:
    name: elastic
    types: deb
    uris: https://artifacts.elastic.co/packages/{{ elastic_major_version }}.x/apt
    suites: "stable"
    components: main
    signed_by: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: "{{ elastic_state }}"
  tags:
    - sw
    - apt

- name: Install ElasticSearch packages
  apt:
    name: "{{ packages }}"
    update_cache: yes
    state: "{{ elastic_state }}"
  vars:
    packages: "{{ elastic_packages }}"
